name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test local action on Node 24
        id: local-action
        uses: ./
        continue-on-error: true
        with:
          secret-key: ci-smoke-test-key
          bridge-url: https://example.com/novu-bridge

      - name: Verify action executed on Node 24
        run: |
          echo "Action outcome: ${{ steps.local-action.outcome }}"
          echo "Action success output: ${{ steps.local-action.outputs.success }}"

          if [ -z "${{ steps.local-action.outputs.success }}" ]; then
            echo "Action did not produce outputs — runtime may have failed to start"
            exit 1
          fi

          if [ "${{ steps.local-action.outputs.success }}" != "false" ]; then
            echo "Unexpected success with test credentials"
            exit 1
          fi

          echo "Action loaded and executed on Node 24"
