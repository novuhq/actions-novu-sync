<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose recovery type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 22px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="C02-Request.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; align-items: center; gap: 6px" aria-label="Step 2 of 4">
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #30333A"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #30333A"></span>
    </div>
    <span style="width: 48px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C8B86; text-align: right">2/4</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 28px; line-height: 1.1; letter-spacing: -0.025em">Choose your truck</h1>
    <p style="margin: 0; font-size: 15px; color: #B5B3AD">For a lowered McLaren 720S, we advise <span style="color: #F6B85A; font-weight: 600">Low-Angle</span>.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
      <button type="button" onClick="{{item.pick}}" aria-pressed="{{item.selected}}" style="display: flex; align-items: center; gap: 14px; min-height: 92px; padding: 16px; border-radius: 20px; border: 1.5px solid {{item.cardBorder}}; background: {{item.cardBg}}; color: inherit; font-family: inherit; text-align: left; cursor: pointer">
        <span style="width: 48px; height: 48px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.06em; background: {{item.tileBg}}; color: {{item.tileInk}}">{{item.id}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="font-size: 17px; font-weight: 600">{{item.name}}</span>
            <sc-if value="{{item.advised}}" hint-placeholder-val="{{false}}">
              <span style="height: 20px; padding: 0 7px; border-radius: 6px; background: #2B2213; color: #F6B85A; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; display: inline-flex; align-items: center">ADVISED</span>
            </sc-if>
          </span>
          <span style="font-size: 13px; line-height: 1.35; color: #8C8B86">{{item.desc}}</span>
        </span>
        <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.14em; color: #8C8B86">FROM AED</span>
          <span style="font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 20px; letter-spacing: -0.02em">{{item.price}}</span>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <a href="C12-Support.dc.html" style="align-self: center; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; color: #B5B3AD; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>Not sure? <span style="color: #F6B85A; font-weight: 600">Ask the concierge</span></a>
    <a href="C04-Confirm.dc.html" style="height: 56px; border-radius: 16px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
      <span>Continue with {{selName}}</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em">FROM AED {{selPrice}}</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'LA';
    const classes = [
      { id: 'WL', name: 'Wheel-Lift', desc: 'Everyday cars · tight urban access', price: '150', advised: false },
      { id: 'FB', name: 'Flatbed', desc: 'Tilt & slide · 4×4s, vans, non-runners', price: '250', advised: false },
      { id: 'LA', name: 'Low-Angle', desc: 'Lowered supercars · zero scraping', price: '450', advised: true },
      { id: 'EN', name: 'Enclosed', desc: 'Supercars & classics · full cover', price: '800', advised: false }
    ];
    const items = classes.map((c) => {
      const on = c.id === sel;
      return Object.assign({}, c, {
        selected: on,
        cardBorder: on ? '#F2A93B' : '#24272C',
        cardBg: on ? '#1C1810' : '#131518',
        tileBg: on ? '#F2A93B' : '#23262B',
        tileInk: on ? '#1B1408' : '#B5B3AD',
        pick: () => this.setState({ sel: c.id })
      });
    });
    const chosen = classes.find((c) => c.id === sel) || classes[2];
    return { items: items, selName: chosen.name, selPrice: chosen.price };
  }
}
</script>
</body>
</html>
