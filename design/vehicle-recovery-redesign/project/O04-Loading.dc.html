<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operator — Loading checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; gap: 14px">
    <a href="O03-Navigation.dc.html" aria-label="Back" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #F6B85A">LOW-ANGLE PROTOCOL</span>
      <span style="font-size: 14px; color: #B5B3AD">Porsche 911 · Sheikh Zayed Rd</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 28px; line-height: 1.1; letter-spacing: -0.025em">Loading checklist</h1>
    <p style="margin: 0; font-size: 15px; color: #B5B3AD">Capture condition before loading.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">PROGRESS</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #F3F1EC">{{doneCount}} / 4</span></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <span style="height: 4px; border-radius: 2px; background: {{s.bar}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; border-radius: 20px; background: #131518; border: 1px solid #24272C; overflow: hidden">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <button type="button" onClick="{{s.toggle}}" aria-pressed="{{s.done}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 0 16px; border: 0; border-top: 1px solid {{s.divider}}; background: transparent; color: inherit; font-family: inherit; text-align: left; cursor: pointer">
        <span style="width: 30px; height: 30px; flex: none; box-sizing: border-box; border-radius: 50%; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: #0B0C0E; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; color: {{s.ink}}">{{s.title}}</span><span style="font-size: 13px; color: #8C8B86">{{s.hint}}</span></span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">CONDITION PHOTOS</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <figure style="margin: 0; height: 92px; border-radius: 16px; background: repeating-linear-gradient(135deg, #16181C 0 10px, #131518 10px 20px); border: 1px solid #24272C; display: flex; align-items: flex-end"><figcaption style="padding: 8px 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; color: #B5B3AD">FRONT ¾</figcaption></figure>
      <figure style="margin: 0; height: 92px; border-radius: 16px; background: repeating-linear-gradient(135deg, #16181C 0 10px, #131518 10px 20px); border: 1px solid #24272C; display: flex; align-items: flex-end"><figcaption style="padding: 8px 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; color: #B5B3AD">SPLITTER · MARK</figcaption></figure>
      <button type="button" style="height: 92px; border-radius: 16px; border: 1.5px dashed #3A3D44; background: transparent; color: #B5B3AD; font-family: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add photo</button>
    </div>
  </div>

  <div style="margin-top: auto">
    <sc-if value="{{complete}}" hint-placeholder-val="{{false}}">
      <a href="O05-Handover.dc.html" style="height: 60px; border-radius: 18px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">Confirm secured · depart<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </sc-if>
    <sc-if value="{{incomplete}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled style="width: 100%; height: 60px; border-radius: 18px; border: 1px solid #2A2D33; background: #131518; color: #8C8B86; font-family: inherit; font-size: 16px; font-weight: 500">Confirm secured · {{remainingLabel}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = { walk: true, marks: true, ramps: false, straps: false };
    const done = Object.assign({}, base, (this.state && this.state.done) || {});
    const defs = [
      { id: 'walk', title: 'Walk-around photographs', hint: 'Four angles, before touching the car' },
      { id: 'marks', title: 'Note existing marks', hint: '1 mark noted · front splitter' },
      { id: 'ramps', title: 'Deploy low-angle ramps', hint: 'Check splitter clearance first' },
      { id: 'straps', title: 'Strap & secure wheels', hint: 'Soft straps on all four wheels' }
    ];
    const steps = defs.map((d, i) => {
      const on = !!done[d.id];
      return Object.assign({}, d, {
        done: on,
        divider: i === 0 ? 'transparent' : '#24272C',
        ring: on ? '#F3F1EC' : '#4A4D55',
        fill: on ? '#F3F1EC' : 'transparent',
        ink: on ? '#B5B3AD' : '#F3F1EC',
        bar: on ? '#F2A93B' : '#30333A',
        toggle: () => {
          const next = Object.assign({}, done);
          next[d.id] = !on;
          this.setState({ done: next });
        }
      });
    });
    const doneCount = steps.filter((s) => s.done).length;
    const remaining = 4 - doneCount;
    return {
      steps: steps,
      doneCount: doneCount,
      remainingLabel: remaining === 1 ? '1 step left' : remaining + ' steps left',
      complete: remaining === 0,
      incomplete: remaining !== 0
    };
  }
}
</script>
</body>
</html>
