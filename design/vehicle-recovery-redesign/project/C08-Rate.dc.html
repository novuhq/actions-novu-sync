<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate and tip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 24px">

  <svg width="390" height="320" viewBox="0 0 390 320" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <defs>
      <radialGradient id="c08Glow" cx="0.85" cy="0.1" r="0.7">
        <stop offset="0" stop-color="#2EBD6B" stop-opacity="0.14"/>
        <stop offset="1" stop-color="#2EBD6B" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="390" height="320" fill="url(#c08Glow)"/>
    <g fill="none" stroke="#1A1D21">
      <circle cx="330" cy="40" r="60"/>
      <circle cx="330" cy="40" r="110"/>
      <circle cx="330" cy="40" r="170"/>
    </g>
  </svg>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: #10251A; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FE3B4"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>DELIVERED · 10:28</span>
    <a href="C10-History.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 700; font-size: 32px; line-height: 1.05; letter-spacing: -0.035em">Safely at<br>the Marina.</h1>
    <p style="margin: 0; font-size: 15px; color: #B5B3AD">Your McLaren 720S was handed over at 10:28, photographed and signed for.</p>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 24px; background: #131518; border: 1px solid #24272C">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 50%; background: #23262B; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 20px">A</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 600">How was Ahmed's service?</span>
        <span style="font-size: 13px; color: #8C8B86">Low-Angle operator · D 12345</span>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; gap: 4px" role="group" aria-label="Rating">
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
        <button type="button" onClick="{{s.pick}}" aria-label="{{s.label}}" aria-pressed="{{s.on}}" style="width: 56px; height: 52px; border: 0; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8-4.3-4.1 5.9-.9z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </sc-for>
    </div>
    <span style="align-self: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; color: #F6B85A">{{ratingWord}}</span>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">ADD A TIP FOR AHMED</span>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tips}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 56px; border-radius: 16px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: {{t.ink}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 4px; border-top: 1px solid #24272C; border-bottom: 1px solid #24272C">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Paid · Visa ·· 4492</span><span style="font-size: 12px; color: #8C8B86">Low-Angle · Sheikh Zayed Rd → Marina · 11 km</span></div>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px">AED 653</span>
  </div>

  <a href="C10-History.dc.html" style="position: relative; margin-top: auto; height: 56px; border-radius: 16px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rating = (this.state && this.state.rating) || 5;
    const tip = (this.state && this.state.tip !== undefined) ? this.state.tip : 50;
    const words = { 1: 'POOR', 2: 'COULD BE BETTER', 3: 'GOOD', 4: 'GREAT', 5: 'EXCEPTIONAL' };
    const stars = [1, 2, 3, 4, 5].map((n) => {
      const on = n <= rating;
      return {
        on: on,
        label: n + (n === 1 ? ' star' : ' stars'),
        fill: on ? '#F2A93B' : 'none',
        stroke: on ? '#F2A93B' : '#4A4D55',
        pick: () => this.setState({ rating: n })
      };
    });
    const tips = [0, 20, 50, 100].map((v) => {
      const on = v === tip;
      return {
        on: on,
        label: v === 0 ? 'None' : 'AED ' + v,
        border: on ? '#F2A93B' : '#30333A',
        bg: on ? '#2B2213' : 'transparent',
        ink: on ? '#F6B85A' : '#F3F1EC',
        pick: () => this.setState({ tip: v })
      };
    });
    const cta = tip === 0 ? 'Submit & finish' : 'Submit · tip AED ' + tip;
    return { stars: stars, tips: tips, ratingWord: words[rating], cta: cta };
  }
}
</script>
</body>
</html>
