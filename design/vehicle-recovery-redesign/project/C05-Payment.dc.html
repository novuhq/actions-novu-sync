<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="C04-Confirm.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; align-items: center; gap: 6px" aria-label="Step 4 of 4">
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
      <span style="width: 18px; height: 4px; border-radius: 2px; background: #F2A93B"></span>
    </div>
    <span style="width: 48px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C8B86; text-align: right">4/4</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 28px; line-height: 1.1; letter-spacing: -0.025em">Payment</h1>
    <p style="margin: 0; font-size: 15px; color: #B5B3AD">Low-Angle recovery · AED 653 incl. VAT</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">CARDS &amp; WALLET</span>
    <div style="display: flex; flex-direction: column; border-radius: 20px; background: #131518; border: 1px solid #24272C; overflow: hidden">
      <sc-for list="{{primary}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.selected}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-top: 1px solid {{m.divider}}; background: {{m.rowBg}}; color: inherit; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 46px; height: 32px; flex: none; border-radius: 8px; background: #23262B; border: 1px solid #30333A; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #F3F1EC">{{m.tile}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #8C8B86">{{m.meta}}</span></span>
          <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{m.radioBorder}}; background: {{m.radioBg}}; display: flex; align-items: center; justify-content: center; color: #1B1408">
            <sc-if value="{{m.selected}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">OTHER WAYS TO PAY</span>
    <div style="display: flex; flex-direction: column; border-radius: 20px; background: #131518; border: 1px solid #24272C; overflow: hidden">
      <sc-for list="{{other}}" as="m" hint-placeholder-count="2">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.selected}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border: 0; border-top: 1px solid {{m.divider}}; background: {{m.rowBg}}; color: inherit; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 46px; height: 32px; flex: none; border-radius: 8px; background: #23262B; border: 1px solid #30333A; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: #F3F1EC">{{m.tile}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #8C8B86">{{m.meta}}</span></span>
          <span style="width: 24px; height: 24px; flex: none; border-radius: 50%; box-sizing: border-box; border: 1.5px solid {{m.radioBorder}}; background: {{m.radioBg}}; display: flex; align-items: center; justify-content: center; color: #1B1408">
            <sc-if value="{{m.selected}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></sc-if>
          </span>
        </button>
      </sc-for>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border: 1px dashed #34373E; border-radius: 16px; background: transparent; color: #B5B3AD; font-family: inherit; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add payment method</button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px; font-size: 13px; color: #8C8B86"><span style="display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Secured payment · VAT invoice included</span></div>
    <a href="C06-Tracking.dc.html" style="height: 56px; border-radius: 16px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state && this.state.sel) || 'visa';
    const decorate = (list) => list.map((m, i) => {
      const on = m.id === sel;
      return Object.assign({}, m, {
        selected: on,
        divider: i === 0 ? 'transparent' : '#24272C',
        rowBg: on ? '#1C1810' : 'transparent',
        radioBorder: on ? '#F2A93B' : '#4A4D55',
        radioBg: on ? '#F2A93B' : 'transparent',
        pick: () => this.setState({ sel: m.id })
      });
    });
    const primary = decorate([
      { id: 'visa', tile: 'VISA', name: 'Visa ·· 4492', meta: 'Expires 09/28 · default' },
      { id: 'mc', tile: 'MC', name: 'Mastercard ·· 8810', meta: 'Expires 03/27' },
      { id: 'apple', tile: 'PAY', name: 'Apple Pay', meta: 'Confirm with Face ID' }
    ]);
    const other = decorate([
      { id: 'cash', tile: 'AED', name: 'Cash on completion', meta: 'Pay the operator directly' },
      { id: 'corp', tile: 'CORP', name: 'Corporate account', meta: 'Monthly invoicing' }
    ]);
    const labels = { visa: 'Pay AED 653', mc: 'Pay AED 653', apple: 'Pay AED 653 with Apple Pay', cash: 'Confirm · pay AED 653 in cash', corp: 'Charge AED 653 to account' };
    return { primary: primary, other: other, cta: labels[sel] };
  }
}
</script>
</body>
</html>
