<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concierge support</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #24272C">
    <a href="C11-Schedule.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <span style="position: relative; width: 44px; height: 44px; flex: none; border-radius: 50%; background: #2B2213; color: #F6B85A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span style="position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #2EBD6B; box-shadow: 0 0 0 2.5px #0B0C0E"></span></span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 600">Concierge</span>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; color: #8C8B86">ONLINE · 24/7</span>
    </div>
    <button type="button" aria-label="Call support" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; background: #F2A93B; color: #1B1408; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px">
    <span style="align-self: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; color: #8C8B86">TODAY · 11:08</span>

    <p style="margin: 0; align-self: flex-start; max-width: 80%; padding: 12px 16px; border-radius: 6px 20px 20px 20px; background: #1A1C20; font-size: 15px; line-height: 1.45">Good morning — how can we help with your recovery today?</p>

    <p style="margin: 0; align-self: flex-end; max-width: 80%; padding: 12px 16px; border-radius: 20px 6px 20px 20px; background: #F3F1EC; color: #0B0C0E; font-size: 15px; line-height: 1.45">Need an enclosed truck for a classic, this Saturday.</p>

    <p style="margin: 0; align-self: flex-start; max-width: 80%; padding: 12px 16px; border-radius: 6px 20px 20px 20px; background: #1A1C20; font-size: 15px; line-height: 1.45">Of course. I can hold a 09:00 slot for you now.</p>

    <article style="align-self: flex-start; width: 86%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 6px 20px 20px 20px; background: #131518; border: 1px solid #30333A">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F2A93B; color: #1B1408; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; font-weight: 500">EN</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Enclosed Transporter</span><span style="font-size: 12px; color: #8C8B86">Sat, 18 Oct · 09:00 – 10:00</span></div>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: #B5B3AD"><span>Emirates Hills → Al Quoz</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; color: #F3F1EC">AED 940</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="height: 44px; border-radius: 12px; border: 1px solid #30333A; background: transparent; color: #F3F1EC; font-family: inherit; font-size: 14px; cursor: pointer">Change</button>
        <button type="button" style="height: 44px; border-radius: 12px; border: 0; background: #F2A93B; color: #1B1408; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Hold slot</button>
      </div>
    </article>
  </div>

  <form style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-radius: 20px; background: #131518; border: 1px solid #2A2D33">
    <button type="button" aria-label="Attach a photo" style="width: 44px; height: 44px; flex: none; border-radius: 14px; border: 0; background: transparent; color: #B5B3AD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <label for="c12msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Message the concierge</label>
    <input id="c12msg" type="text" placeholder="Message the concierge" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #F3F1EC; font-family: inherit; font-size: 15px; outline: none">
    <button type="submit" aria-label="Send" style="width: 44px; height: 44px; flex: none; border-radius: 14px; border: 0; background: #23262B; color: #F3F1EC; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
</div>
</x-dc>
