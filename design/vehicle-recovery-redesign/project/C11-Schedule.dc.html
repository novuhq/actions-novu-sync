<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule a transport</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; gap: 14px">
    <a href="C09-Premium.dc.html" aria-label="Back" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 22px; line-height: 1.1; letter-spacing: -0.025em">Schedule a transport</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #131518; border: 1px solid #24272C">
    <span style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: #F2A93B; color: #1B1408; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.06em; font-weight: 500">EN</span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 600">Enclosed Transporter</span>
      <span style="font-size: 13px; color: #8C8B86">Ferrari Roma · villa to service centre</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">DATE · OCTOBER</span>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px" role="group" aria-label="Date">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="height: 72px; border-radius: 16px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.12em; opacity: 0.8">{{d.dow}}</span>
          <span style="font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 20px; line-height: 1">{{d.num}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">PICK-UP WINDOW</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px" role="group" aria-label="Pick-up window">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 50px; border-radius: 14px; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: {{s.ink}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.02em; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: center; gap: 8px; padding: 16px; border-radius: 20px; background: #131518; border: 1px solid #24272C">
    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; color: #8C8B86">FROM</span><span style="font-size: 15px; font-weight: 600">Emirates Hills</span></div>
    <svg width="28" height="20" viewBox="0 0 28 20" fill="none" stroke="#8C8B86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10h22M18 4l6 6-6 6"/></svg>
    <div style="display: flex; flex-direction: column; gap: 3px; text-align: right"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; color: #8C8B86">TO</span><span style="font-size: 15px; font-weight: 600">Al Quoz</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px">
      <span style="font-size: 15px; color: #B5B3AD">Estimate <span style="color: #8C8B86; font-size: 13px">· concierge confirms</span></span>
      <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8C8B86">AED</span><span style="font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 30px; letter-spacing: -0.03em; line-height: 1">940</span></span>
    </div>
    <a href="C12-Support.dc.html" style="height: 56px; border-radius: 16px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const day = (this.state && this.state.day) || 18;
    const slot = (this.state && this.state.slot) || '09:00 – 10:00';
    const dayList = [
      { num: 15, dow: 'WED', name: 'Wed' },
      { num: 16, dow: 'THU', name: 'Thu' },
      { num: 17, dow: 'FRI', name: 'Fri' },
      { num: 18, dow: 'SAT', name: 'Sat' },
      { num: 19, dow: 'SUN', name: 'Sun' },
      { num: 20, dow: 'MON', name: 'Mon' }
    ];
    const days = dayList.map((d) => {
      const on = d.num === day;
      return Object.assign({}, d, {
        on: on,
        border: on ? '#F2A93B' : '#24272C',
        bg: on ? '#F2A93B' : '#131518',
        ink: on ? '#1B1408' : '#F3F1EC',
        pick: () => this.setState({ day: d.num })
      });
    });
    const slots = ['08:00 – 09:00', '09:00 – 10:00', '10:00 – 11:00', '11:00 – 12:00'].map((label) => {
      const on = label === slot;
      return {
        label: label,
        on: on,
        border: on ? '#F2A93B' : '#30333A',
        bg: on ? '#2B2213' : 'transparent',
        ink: on ? '#F6B85A' : '#F3F1EC',
        pick: () => this.setState({ slot: label })
      };
    });
    const chosen = dayList.find((d) => d.num === day) || dayList[3];
    return { days: days, slots: slots, cta: 'Book for ' + chosen.name + ', ' + chosen.num + ' Oct' };
  }
}
</script>
</body>
</html>
