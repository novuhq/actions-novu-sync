<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Operator — Handover and signature</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#F6B85A}a:hover{color:#FFD08A}
@keyframes inkDraw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B0C0E; color: #F3F1EC; font-family: 'Instrument Sans', 'Helvetica Neue', system-ui, sans-serif; padding: 58px 20px 34px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; align-items: center; gap: 14px">
    <a href="O04-Loading.dc.html" aria-label="Back" style="width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid #2A2D33; background: #131518; color: #F3F1EC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #F6B85A">HANDOVER · DUBAI MARINA</span>
      <span style="font-size: 14px; color: #B5B3AD">Porsche 911 · Low-Angle</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; font-stretch: 125%; font-weight: 650; font-size: 28px; line-height: 1.1; letter-spacing: -0.025em">Confirm delivery</h1>
    <p style="margin: 0; font-size: 15px; color: #B5B3AD">Unloaded and inspected with the owner.</p>
  </div>

  <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-radius: 20px; background: #131518; border: 1px solid #24272C">
    <li style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px">
      <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #F3F1EC; color: #0B0C0E; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Vehicle unloaded safely</span><span style="font-size: 13px; color: #8C8B86">Low-angle ramps · no contact</span></span>
    </li>
    <li style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border-top: 1px solid #24272C">
      <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #F3F1EC; color: #0B0C0E; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Condition re-photographed</span><span style="font-size: 13px; color: #8C8B86">Matches pick-up record</span></span>
    </li>
  </ul>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; color: #8C8B86">OWNER SIGNATURE</span>
      <button type="button" onClick="{{clear}}" style="min-height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; color: #F6B85A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{clearLabel}}</button>
    </div>
    <div style="position: relative; height: 196px; border-radius: 20px; background: #F3F1EC; overflow: hidden" role="img" aria-label="{{padLabel}}">
      <sc-if value="{{signed}}" hint-placeholder-val="{{true}}">
        <svg width="350" height="196" viewBox="0 0 350 196" aria-hidden="true" style="position: absolute; inset: 0">
          <path d="M34 118C48 64 70 58 76 104S96 146 110 98S138 44 150 94C155 118 170 120 180 96S204 70 214 100S244 128 258 86C266 64 284 70 300 92" fill="none" stroke="#0B0C0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="900" style="animation: inkDraw 1.6s ease-out both"/>
          <path d="M66 138C118 130 204 126 296 136" fill="none" stroke="#0B0C0E" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="900" style="animation: inkDraw 1.6s .9s ease-out both"/>
        </svg>
      </sc-if>
      <sc-if value="{{unsigned}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #6B6963">Ask the owner to sign here</span>
      </sc-if>
      <span aria-hidden="true" style="position: absolute; left: 20px; right: 20px; bottom: 34px; height: 1px; background: #C9C6BF"></span>
      <span aria-hidden="true" style="position: absolute; left: 20px; bottom: 40px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: #8A877F">×</span>
      <span style="position: absolute; left: 20px; right: 20px; bottom: 12px; display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; color: #55534E"><span>VEHICLE OWNER</span><span>{{stamp}}</span></span>
    </div>
  </div>

  <div style="margin-top: auto">
    <sc-if value="{{signed}}" hint-placeholder-val="{{true}}">
      <a href="O06-Earnings.dc.html" style="height: 60px; border-radius: 18px; background: #F2A93B; color: #1B1408; text-decoration: none; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">Complete job<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></a>
    </sc-if>
    <sc-if value="{{unsigned}}" hint-placeholder-val="{{false}}">
      <button type="button" disabled style="width: 100%; height: 60px; border-radius: 18px; border: 1px solid #2A2D33; background: #131518; color: #8C8B86; font-family: inherit; font-size: 16px; font-weight: 500">Owner signature required</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const signed = !(this.state && this.state.cleared);
    return {
      signed: signed,
      unsigned: !signed,
      clearLabel: signed ? 'Clear' : 'Sign again',
      padLabel: signed ? 'Owner signature captured' : 'Signature pad, empty',
      stamp: signed ? '08:46 · DUBAI MARINA' : 'NOT SIGNED',
      clear: () => this.setState({ cleared: signed })
    };
  }
}
</script>
</body>
</html>
